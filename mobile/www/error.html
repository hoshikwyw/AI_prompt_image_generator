<!doctype html>
<!--
  Shown when the site fails to load — no connection, or the server is down.
  Capacitor opens this from inside the app (server.errorPath), so it works
  offline. config.js is generated from app.config.json and says where "back to
  the site" is.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Promptbook — offline</title>
    <script src="config.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0a0c12;
        color: #e7ebf3;
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 96px;
        height: 96px;
        /* Greyed a little: the mascot is having a sad moment. */
        filter: grayscale(0.4);
        opacity: 0.85;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #97a1b5;
      }
      button {
        margin-top: 1.5rem;
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.875rem;
        background: #e7ebf3;
        color: #0a0c12;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="" />
      <h1>Can't reach Promptbook</h1>
      <p>Check your internet connection. This page will reconnect by itself when you're back online.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      function retry() {
        if (window.PROMPTBOOK_URL) location.href = window.PROMPTBOOK_URL;
        else location.href = "index.html";
      }
      document.getElementById("retry").addEventListener("click", retry);
      // Most outages on a phone are a dropped connection, so recover without
      // making anyone find the button.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
