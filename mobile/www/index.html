<!doctype html>
<!--
  Shown only when the app was built without a site URL (SERVER_URL in
  capacitor.config.ts). A correctly built app never displays this page: it
  loads the deployed site instead.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Promptbook</title>
    <style>
      /* Follows the phone's light/dark setting, with the site's own colours. */
      :root {
        color-scheme: light dark;
        --bg: #0a0c12;
        --fg: #e7ebf3;
        --muted: #97a1b5;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --fg: #121620;
          --muted: #4a5366;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      code {
        color: var(--fg);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.875em;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="" />
      <h1>Promptbook isn't set up yet</h1>
      <p>
        This build doesn't know which site to open. Set <code>SERVER_URL</code> in
        <code>mobile/capacitor.config.ts</code> to the deployed site and rebuild the app.
      </p>
    </main>
  </body>
</html>
